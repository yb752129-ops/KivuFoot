      rel="stylesheet"
    />
    <script>
      (function () {
        var k = "kivufoot_apparence";
        var c = "dark";
        try { c = localStorage.getItem(k) || "dark"; } catch (e) {}
        var d = c === "dark" || c === "system";
        document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        document.documentElement.style.colorScheme = "dark";
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #0a1411;
        color: #f4efe3;
      }
      .preload {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #0a1411;
        color: #c5c6bb;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.85rem;
      }
    </style>
  </head>

    <div id="root">
      <div class="preload" role="status" aria-live="polite">Chargement…</div>
