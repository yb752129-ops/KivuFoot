<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3EFE4" />
    <title>KivuFoot — Football local, Sud-Kivu</title>
    <meta name="description" content="Résultats, classements et validation du football local à Bukavu et Uvira." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Newsreader:opsz,wght@6..72,500;6..72,650&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var k = "kivufoot_apparence";
        var c = "light";
        try { c = localStorage.getItem(k) || "light"; } catch (e) {}
        var d = c === "dark" || (c === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      })();
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #F4F1EA; color: #1C1914; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #14120e; color: #ede8dc; }
      .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem 1.2rem; font-family: Georgia, "Noto Serif", serif; }
      .boot-k { margin: 0 0 1.5rem; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.03em; }
      .boot-orb { position: relative; width: 7.4rem; height: 7.4rem; }
      .boot-ring { position: absolute; inset: 0; border: 1.5px solid #1F4D36; opacity: 0.28; border-radius: 50%; }
      .boot-spin { position: absolute; inset: 0; border-radius: 50%; animation: kf-spin 1.15s linear infinite; }
      .boot-spin::before { content: ""; position: absolute; inset: 0; border: 2px solid transparent; border-top-color: #1F4D36; border-radius: 50%; }
      .boot-dot { position: absolute; top: -2px; left: 50%; width: 8px; height: 8px; margin-left: -4px; background: #c62828; border-radius: 50%; }
      .boot-ball { position: absolute; inset: 2rem; animation: kf-spin 2.4s linear infinite; }
      .boot-kicker { margin: 1.3rem 0 0; font-family: "Source Sans 3", sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #1F4D36; }
      .boot-titre { margin: 0.35rem 0 0.4rem; font-size: 1.7rem; font-weight: 650; }
      .boot-txt { margin: 0; max-width: 22rem; font-family: "Source Sans 3", sans-serif; font-size: 0.95rem; color: #5e584f; }
      @keyframes kf-spin { to { transform: rotate(360deg); } }
    </style>
    <style>
      html, body, #root { background: #14120e; color: #ede8dc; }
      .boot-k { color: #ede8dc; }
      .boot-kicker { color: #6faf86; }
      .boot-txt { color: #a39c90; }
      .boot-orb { width: 9.2rem; height: 9.2rem; }
      .boot-anneau { width: 100%; height: 100%; display: block; }
      .boot-anneau-tour { transform-box: fill-box; transform-origin: center; animation: kf-spin 3s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-busy="true">
        <p class="boot-k">KivuFoot</p>
        <div class="boot-orb" aria-hidden="true">
          <svg class="boot-anneau" viewBox="0 0 120 120">
            <g class="boot-anneau-tour">
              <path d="M55.3 113.8 A54 54 0 0 1 55.3 6.2" fill="none" stroke="#EFEDE6" stroke-width="6" stroke-linecap="round"/>
              <path d="M64.7 6.2 A54 54 0 0 1 64.7 113.8" fill="none" stroke="#028a4e" stroke-width="6" stroke-linecap="round"/>
            </g>
            <circle cx="60" cy="60" r="40" fill="#F2ECDB"/>
                        <path d="M73.5 93.4 A36 36 0 0 1 46.5 93.4 L55.0 83.5 A24 24 0 0 0 65.0 83.5 Z" fill="#14120e"/>
            <path d="M32.4 83.1 A36 36 0 0 1 24.1 57.5 L36.1 62.5 A24 24 0 0 0 39.2 72.0 Z" fill="#14120e"/>
            <path d="M29.5 40.9 A36 36 0 0 1 51.3 25.1 L50.2 38.1 A24 24 0 0 0 42.2 43.9 Z" fill="#14120e"/>
            <path d="M68.7 25.1 A36 36 0 0 1 90.5 40.9 L77.8 43.9 A24 24 0 0 0 69.8 38.1 Z" fill="#14120e"/>
            <path d="M95.9 57.5 A36 36 0 0 1 87.6 83.1 L80.8 72.0 A24 24 0 0 0 83.9 62.5 Z" fill="#14120e"/>
            <polygon points="60.0 41.0 78.1 54.1 71.2 75.4 48.8 75.4 41.9 54.1" fill="#0F3D2E" stroke="#F2ECDB" stroke-width="2"/>
            <path d="M60 47 C62.6 49.6 61.8 53 60.9 55.8 C62.6 59.4 61.8 65 59.2 68.6 C57.4 65 56.6 61.4 57.4 57.8 C55.8 54.2 57.4 49.6 60 47 Z" fill="#F2ECDB"/>
          </svg>
        </div>
        <p class="boot-kicker">Connexion en cours</p>
        <p class="boot-titre">Le terrain se prépare.</p>
        <p class="boot-txt">Nous synchronisons les scores et les feuilles officielles du championnat.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
