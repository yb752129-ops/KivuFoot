<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KivuFoot — Démo composition professionnelle</title>
  <style>
    :root{--paper:#14120e;--paper2:#1d1a15;--green:#0b2e22;--green2:#123b2c;--lime:#c8f04a;--cream:#efede6;--muted:#a39c90;--rule:rgba(239,237,230,.18);--red:#e07a7a;--orange:#d4895c;--blue:#8eb4c4}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--cream);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
    .wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}.top{background:var(--green);border-bottom:1px solid rgba(239,237,230,.12);padding:16px 16px 14px}.top-inner{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;font-size:28px;font-weight:700}.demo-pill{border:1px solid var(--lime);border-radius:999px;color:var(--lime);padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.eyebrow{margin:0 0 3px;color:var(--lime);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.muted{color:var(--muted)}h1{font:700 clamp(30px,8vw,48px)/1.05 Georgia,serif;margin:7px 0 10px}h2{font:700 21px/1.1 Georgia,serif;margin:0}.lead{color:var(--muted);margin:0 0 22px}.panel{margin:16px 0;padding:16px;border:1px solid var(--rule);border-radius:17px;background:rgba(29,26,21,.72)}.btn{min-height:44px;border:1px solid var(--rule);border-radius:10px;padding:10px 14px;background:transparent;color:var(--cream);font-weight:800}.btn-primary{border-color:var(--lime);background:var(--lime);color:#14201a}.btn:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}
    .login{min-height:100vh;display:grid;place-items:center;padding:18px}.login-card{width:min(440px,100%);padding:23px 0}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0;color:var(--muted)}.field input,.field select,.search input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:transparent;color:var(--cream);outline:0}.field input:focus,.field select:focus,.search input:focus{border-color:var(--lime)}.field select option{background:var(--paper);color:var(--cream)}.hint{border-left:3px solid var(--blue);background:rgba(142,180,196,.1);padding:11px 12px;color:var(--muted);font-size:13px}.error{color:var(--red);font-weight:700;margin:12px 0}.success{color:var(--lime);font-weight:700;margin:12px 0}.hidden{display:none!important}
    .match{display:grid;grid-template-columns:1fr 72px 1fr;gap:8px;align-items:center;background:var(--green);border:1px solid var(--green2);border-radius:17px;padding:15px 10px;text-align:center}.team{min-width:0}.team strong{display:block;font-size:15px;overflow-wrap:anywhere}.team small{color:rgba(239,237,230,.65);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.vs{display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--muted);font-size:11px}.vs b{color:var(--lime);font-size:20px}.status{display:inline-block;border:1px solid var(--lime);border-radius:999px;color:var(--lime);padding:3px 7px;font-size:10px;font-weight:800;text-transform:uppercase}
    .summary-head,.section-head,.counter-top,.savebar{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{border:1px solid var(--rule);border-radius:999px;padding:5px 9px;color:var(--lime);font-size:11px;font-weight:800}.counters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.counter-top{color:var(--muted);font-size:13px}.counter-top b{font:700 21px "Arial Narrow",sans-serif;color:var(--cream)}.track{height:6px;margin-top:6px;border-radius:9px;background:rgba(239,237,230,.15);overflow:hidden}.track i{display:block;height:100%;background:var(--lime);border-radius:inherit}.track.bench i{background:var(--orange)}.selected-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selected-column{min-width:0;padding:10px;border:1px solid var(--rule);border-radius:10px;background:rgba(20,18,14,.35)}.selected-title{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--rule);font-size:12px}.selected-title span{color:var(--lime);font-weight:800}.selected-list{display:grid;gap:5px;margin:8px 0 0;padding:0;list-style:none}.selected-list li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;align-items:center;font-size:11px}.selected-number{display:grid;place-items:center;width:22px;height:22px;border:1px solid var(--lime);border-radius:50%;color:var(--lime);font-size:10px;font-weight:800}.selected-list li span:last-child{display:flex;flex-direction:column;min-width:0}.selected-list strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selected-list small{color:var(--muted);font-size:10px}.selected-empty{margin:8px 0 0;color:var(--muted);font-size:11px}@media(max-width:560px){.selected-grid{grid-template-columns:1fr}}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip,.filter{min-height:36px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--cream);padding:7px 11px;font-size:13px;font-weight:700}.chip.active,.filter.active{border-color:var(--lime);background:var(--lime);color:#14201a}
    .help{color:var(--muted);font-size:12px;margin:0 0 12px}.pitch{position:relative;min-height:355px;overflow:hidden;padding:20px 8px;border:2px solid rgba(200,240,74,.6);border-radius:14px;background:linear-gradient(180deg,rgba(19,83,54,.95),rgba(8,43,31,.95))}.pitch:before,.pitch:after{content:"";position:absolute;left:8%;right:8%;height:45px;border:1px solid rgba(239,237,230,.3)}.pitch:before{top:9px;border-top:0}.pitch:after{bottom:9px;border-bottom:0}.midline{position:absolute;left:5%;right:5%;top:50%;border-top:1px solid rgba(239,237,230,.3)}.circle{position:absolute;top:calc(50% - 33px);left:calc(50% - 33px);width:66px;height:66px;border:1px solid rgba(239,237,230,.3);border-radius:50%}.pitch-rows{position:relative;z-index:1;min-height:315px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}.pitch-row{display:flex;justify-content:space-evenly;gap:4px}.token,.empty-slot{width:49px;min-height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}.token b,.empty-slot{width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--lime);border-radius:50%;background:var(--green);color:var(--cream);font-size:11px;font-weight:800}.token small{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cream);font-size:10px;font-weight:700}.empty-slot{border-style:dashed;color:var(--lime);background:rgba(11,46,34,.55)}
    .tools{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.search input{min-height:42px}.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.check input{accent-color:var(--lime)}.filters{display:flex;gap:6px;overflow:auto;padding:12px 0 5px}.filter{white-space:nowrap;font-size:12px;padding:6px 10px}
    .player{display:grid;grid-template-columns:42px 1fr 54px;gap:9px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}.avatar{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;background:var(--paper2);color:var(--lime);font-size:11px;font-weight:800}.info{min-width:0;display:flex;flex-direction:column;gap:2px}.info strong{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info span{color:var(--muted);font-size:12px}.info small{font-size:11px;color:var(--lime)}.info small.blocked{color:var(--red);font-weight:800}.number{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:800}.number input{width:50px;min-height:38px;border:1px solid var(--rule);border-radius:7px;background:transparent;color:var(--cream);text-align:center}.player.selected-starter{border-left:3px solid var(--lime);padding-left:7px}.player.selected-bench{border-left:3px solid var(--orange);padding-left:7px}.actions{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.actions button{min-height:38px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--cream);font-size:11px;font-weight:800}.actions button.active{border-color:var(--lime);background:var(--lime);color:#14201a}.actions button.remove{border-color:var(--red);color:var(--red)}.player.blocked{background:rgba(224,122,122,.08)}.empty-state{padding:20px 0;color:var(--muted);font-size:13px}.savebar{position:sticky;bottom:12px;margin-top:16px;padding:12px;border:1px solid var(--rule);border-radius:13px;background:rgba(20,18,14,.94);box-shadow:0 -5px 20px rgba(0,0,0,.25);backdrop-filter:blur(8px)}.savebar strong{display:block;font-size:12px}.savebar small{display:block;color:var(--muted);font-size:11px}.savebar .btn{width:auto;padding:9px 10px;font-size:12px;white-space:nowrap}
    @media(max-width:520px){.wrap{padding-inline:13px}.settings-grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.savebar{align-items:stretch;flex-direction:column}.savebar .btn{width:100%}.match{grid-template-columns:1fr 54px 1fr}.team strong{font-size:13px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (() => {
      const KEY = "kivufoot_composition_demo_html";
      const FORMATIONS = ["4-2-3-1","4-3-3","4-4-2","4-1-4-1","4-4-1-1","4-3-2-1","4-5-1","4-2-2-2","3-5-2","3-4-3","3-4-2-1","3-4-1-2","3-6-1","3-3-3-1","5-3-2","5-4-1","5-2-3","5-3-1-1","4-1-2-1-2","4-2-1-3","4-3-1-2","3-2-4-1"];
      const formationRowsFor = formation => {
        const numbers=String(formation||"4-3-3").split("-").map(Number).filter(n=>Number.isInteger(n)&&n>0);
        if(numbers.length<2)return formationRowsFor("4-3-3");
        return [["Gardien","gardien",1],...numbers.map((places,index)=>[index===0?"Défense":index===numbers.length-1?"Attaque":"Milieu",index===0?"defenseur":index===numbers.length-1?"attaquant":"milieu",places])];
      };
      const labels = {gardien:"Gardien",defenseur:"Défenseur",milieu:"Milieu",attaquant:"Attaquant"};
      const positions = ["gardien","gardien",...Array(6).fill("defenseur"),...Array(6).fill("milieu"),...Array(5).fill("attaquant")];
      const players = positions.map((poste,i) => ({
        id:1001+i, name:i===18?"DEMO A Joueur avec un nom volontairement très long pour vérifier l'affichage mobile":`DEMO A Joueur ${i+1}`,
        poste, number:i+1, blocked:i===17
      }));
      const state = { formation:"4-3-3", coach:"Entraîneur principal DEMO A", choice:{}, numbers:{}, search:"", filter:"tous", only:false, message:"" };
      try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)||"{}")); } catch (_) {}
      const root = document.getElementById("root");
      const initials = n => String(n).split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
      const shortName = n => { const words=String(n).trim().split(/\s+/).filter(Boolean); return words.length<=2?words.join(" "):words.slice(-2).join(" "); };
      const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
      const counts = () => { const values=Object.values(state.choice); return {starter:values.filter(x=>x==="titulaire").length, bench:values.filter(x=>x==="remplacant").length}; };
      function saveLocal(){ localStorage.setItem(KEY,JSON.stringify(state)); }
      function login(){
        root.innerHTML = `<div class="login"><div class="login-card"><div class="top" style="border-radius:17px;margin-bottom:20px"><div class="top-inner"><span class="brand">KivuFoot</span><span class="demo-pill">Démo isolée</span></div></div><p class="eyebrow">Préproduction visuelle</p><h1>Composition</h1><p class="lead">Cette page utilise uniquement des données fictives. Elle ne contacte pas le championnat réel.</p><div class="hint"><b>Compte DEMO</b><br>coach.composition.demo@example.com<br>ChangeMoiEnDemo123!</div><form id="loginForm" class="panel"><label class="field">E-mail<input id="email" type="email" value="coach.composition.demo@example.com" required></label><label class="field">Mot de passe<input id="password" type="password" value="ChangeMoiEnDemo123!" required></label><p id="loginError" class="error hidden">E-mail ou mot de passe incorrect.</p><button class="btn btn-primary full" type="submit">Entrer dans la démo</button></form></div></div>`;
        document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault(); if(document.getElementById("email").value.trim()==="coach.composition.demo@example.com"&&document.getElementById("password").value==="ChangeMoiEnDemo123!"){app()}else document.getElementById("loginError").classList.remove("hidden")});
      }
      function pitch(){
        const selected=players.filter(p=>state.choice[p.id]==="titulaire"); const left={gardien:selected.filter(p=>p.poste==="gardien"),defenseur:selected.filter(p=>p.poste==="defenseur"),milieu:selected.filter(p=>p.poste==="milieu"),attaquant:selected.filter(p=>p.poste==="attaquant")};
        const used=[]; const rows=formationRowsFor(state.formation).map(([label,poste,places])=>{const take=[];for(let i=0;i<places;i++){const preferred=(left[poste]||[]).find(p=>!used.includes(p.id));const fallback=selected.find(p=>!used.includes(p.id));const p=preferred||fallback;if(!p)break;take.push(p);used.push(p.id)}let cells="";for(let i=0;i<places;i++){const p=take[i];cells+=p?`<span class="token"><b>${esc(state.numbers[p.id]||p.number)}</b><small>${esc(shortName(p.name))}</small></span>`:`<span class="empty-slot">+</span>`}return `<div class="pitch-row" title="${label}">${cells}</div>`}).join("");
        const extra=selected.filter(p=>!used.includes(p.id)); return `<div class="pitch"><div class="midline"></div><div class="circle"></div><div class="pitch-rows">${rows}</div></div>${extra.length?`<p class="muted" style="font-size:12px">Titulaires non placés dans l'aperçu : ${extra.map(p=>esc(p.name)).join(", ")}</p>`:""}`;
      }
      function selectedNames(role){ const list=players.filter(p=>state.choice[p.id]===role); if(!list.length)return `<p class="selected-empty">Les noms apparaîtront automatiquement ici.</p>`; return `<ol class="selected-list">${list.map(p=>`<li><span class="selected-number">${esc(state.numbers[p.id]||p.number)}</span><span><strong>${esc(p.name)}</strong><small>${labels[p.poste]}</small></span></li>`).join("")}</ol>`; }
      function validation(){
        const c=counts(), errors=[]; if(c.starter!==11) errors.push(`La composition doit contenir exactement 11 titulaires (actuellement ${c.starter}).`); if(c.bench>7) errors.push("Maximum 7 remplaçants."); const used={}; players.forEach(p=>{if(!state.choice[p.id])return; if(p.blocked)errors.push(`${p.name} est suspendu dans cette démo.`); const raw=state.numbers[p.id]??p.number;if(raw==="")return;const n=Number(raw);if(!Number.isInteger(n)||n<1||n>99)errors.push(`Le numéro de ${p.name} doit être entre 1 et 99.`);else if(used[n])errors.push(`Le numéro ${n} est en doublon (${used[n]} / ${p.name}).`);else used[n]=p.name}); return errors; }
      function setRole(id,role){ const p=players.find(x=>x.id===id), current=state.choice[id]; if(current===role){delete state.choice[id];state.message="";render();return} if(p.blocked){state.message="Ce joueur est suspendu dans la démo.";render();return} const c=counts();if(role==="titulaire"&&c.starter>=11){state.message="Les 11 places de titulaires sont déjà occupées.";render();return}if(role==="remplacant"&&c.bench>=7){state.message="Les 7 places du banc sont déjà occupées.";render();return}state.choice[id]=role;state.message="";render();}
      function render(){
        const c=counts(), errors=validation(), text=state.search.toLocaleLowerCase("fr");
        const visible=players.filter(p=>(!text||p.name.toLocaleLowerCase("fr").includes(text))&&(state.filter==="tous"||p.poste===state.filter)&&(!state.only||state.choice[p.id])).map(p=>p);
        root.innerHTML=`<header class="top"><div class="top-inner"><span class="brand">KivuFoot</span><span class="demo-pill">Démo isolée</span></div></header><main class="wrap"><p class="eyebrow" style="margin-top:20px">Feuille de composition · DEMO</p><h1>DEMO Composition A</h1><p class="lead">Aperçu professionnel mobile. Aucune donnée du championnat réel n'est utilisée.</p><section class="match"><div class="team"><strong>DEMO Composition A</strong><small>Domicile</small></div><div class="vs"><b>VS</b><span>J1-DEMO</span><span class="status">Programmé</span></div><div class="team"><strong>DEMO Composition B</strong><small>Extérieur</small></div></section><section class="panel"><div class="summary-head"><div><p class="eyebrow">État de la feuille</p><b>${state.message?"Modifications à vérifier":"Brouillon DEMO"}</b></div><span class="badge">${state.message?"À vérifier":"Prête à tester"}</span></div><div class="counters"><div><div class="counter-top"><span>Onze titulaire</span><b>${c.starter}/11</b></div><div class="track"><i style="width:${Math.min(100,c.starter/11*100)}%"></i></div></div><div><div class="counter-top"><span>Banc</span><b>${c.bench}/7</b></div><div class="track bench"><i style="width:${Math.min(100,c.bench/7*100)}%"></i></div></div></div></section><section class="panel"><div class="section-head"><div><p class="eyebrow">Feuille automatique</p><h2>Noms sélectionnés</h2></div><span class="muted">Depuis l'effectif</span></div><div class="selected-grid"><div class="selected-column"><div class="selected-title"><strong>Titulaires</strong><span>${c.starter}/11</span></div>${selectedNames("titulaire")}</div><div class="selected-column"><div class="selected-title"><strong>Banc</strong><span>${c.bench}/7</span></div>${selectedNames("remplacant")}</div></div></section>${state.message?`<p class="error">${esc(state.message)}</p>`:""}${errors.length?`<div class="hint" style="border-color:var(--red)"><b>Contrôles à corriger</b><br>${errors.map(esc).join("<br>")}</div>`:""}<section class="panel"><div class="section-head"><div><p class="eyebrow">Paramètres</p><h2>Formation et encadrement</h2></div></div><div class="settings-grid"><label class="field">Formation tactique<select id="formation">${FORMATIONS.map(f=>`<option value="${f}" ${state.formation===f?"selected":""}>${f}</option>`).join("")}</select></label><label class="field">Entraîneur<select id="coach"><option>Entraîneur principal DEMO A</option></select></label></div><div class="chips">${FORMATIONS.map(f=>`<button class="chip ${state.formation===f?"active":""}" data-formation="${f}">${f}</button>`).join("")}</div></section><section class="panel"><div class="section-head"><div><p class="eyebrow">Aperçu</p><h2>Onze titulaire</h2></div><span class="muted">${esc(state.formation||"Formation")}</span></div><p class="help">Les joueurs sont placés selon leur poste enregistré.</p>${pitch()}</section><section class="panel"><div class="section-head"><div><p class="eyebrow">Sélection</p><h2>Effectif disponible</h2></div><span class="muted">${visible.length}/${players.length}</span></div><div class="tools"><label class="search"><input id="search" placeholder="Rechercher un joueur" value="${esc(state.search)}"></label><label class="check"><input id="only" type="checkbox" ${state.only?"checked":""}> Sélectionnés</label></div><div class="filters">${[["tous","Tous"],["gardien","Gardiens"],["defenseur","Défenseurs"],["milieu","Milieux"],["attaquant","Attaquants"]].map(([id,label])=>`<button class="filter ${state.filter===id?"active":""}" data-filter="${id}">${label}</button>`).join("")}</div><div>${visible.length?visible.map(p=>{const role=state.choice[p.id],num=state.numbers[p.id]??p.number;return `<article class="player ${role?`selected-${role}`:""} ${p.blocked?"blocked":""}"><span class="avatar">${initials(p.name)}</span><div class="info"><strong>${esc(p.name)}</strong><span>${labels[p.poste]} · N° profil ${p.number}</span>${p.blocked?`<small class="blocked">🔴 Joueur suspendu dans la démo</small>`:`<small>✅ Éligible DEMO</small>`}</div><label class="number">N°<input data-number="${p.id}" type="number" min="1" max="99" value="${esc(num)}"></label><div class="actions"><button class="${role==="titulaire"?"active":""}" data-role="titulaire" data-id="${p.id}">Titulaire</button><button class="${role==="remplacant"?"active":""}" data-role="remplacant" data-id="${p.id}">Banc</button>${role?`<button class="remove" data-role="remove" data-id="${p.id}">Retirer</button>`:""}</div></article>`}).join(""):`<div class="empty-state">Aucun joueur ne correspond à ce filtre.</div>`}</div></section><div class="savebar"><div><strong>${errors.length?"Corriger avant d'enregistrer":"Prêt à enregistrer le brouillon"}</strong><small>La sauvegarde reste locale à cette démo.</small></div><button id="save" class="btn btn-primary" ${errors.length?"disabled":""}>Enregistrer le brouillon</button></div></main>`;
        document.querySelectorAll("[data-formation]").forEach(b=>b.onclick=()=>{state.formation=b.dataset.formation;render()});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id);if(b.dataset.role==="remove")setRole(id,state.choice[id]);else setRole(id,b.dataset.role)});document.querySelectorAll("[data-number]").forEach(i=>i.oninput=()=>{state.numbers[Number(i.dataset.number)]=i.value;render()});document.getElementById("formation").onchange=e=>{state.formation=e.target.value;render()};document.getElementById("search").oninput=e=>{state.search=e.target.value;render()};document.getElementById("only").onchange=e=>{state.only=e.target.checked;render()};document.getElementById("save").onclick=()=>{saveLocal();state.message="Composition DEMO enregistrée avec succès.";render()};
      }
      function app(){render()}
      login();
    })();
  </script>
</body>
</html>
